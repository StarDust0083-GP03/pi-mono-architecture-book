="20" fill="#20201d">ai</text><text x="750.0" y="93" text-anchor="middle" font-size="15" fill="#6b6a64">模型接入</text><rect x="600" y="140" width="300" height="88" rx="6" fill="#faf9f5" stroke="#1B365D" stroke-width="1.5"/><text x="750.0" y="170" text-anchor="middle" font-size="20" fill="#20201d">agent-core</text><text x="750.0" y="213" text-anchor="middle" font-size="15" fill="#6b6a64">Agent 与循环</text><rect x="600" y="260" width="300" height="88" rx="6" fill="#faf9f5" stroke="#1B365D" stroke-width="1.5"/><text x="750.0" y="290" text-anchor="middle" font-size="20" fill="#20201d">tui</text><text x="750.0" y="333" text-anchor="middle" font-size="15" fill="#6b6a64">终端渲染</text><rect x="600" y="380" width="300" height="88" rx="6" fill="#faf9f5" stroke="#1B365D" stroke-width="1.5"/><text x="750.0" y="410" text-anchor="middle" font-size="20" fill="#20201d">codemode</text><text x="750.0" y="453" text-anchor="middle" font-size="15" fill="#6b6a64">独立沙箱库</text><rect x="600" y="500" width="300" height="88" rx="6" fill="#faf9f5" stroke="#1B365D" stroke-width="1.5"/><text x="750.0" y="530" text-anchor="middle" font-size="20" fill="#20201d">mcp</text><text x="750.0" y="573" text-anchor="middle" font-size="15" fill="#6b6a64">独立协议客户端</text><text x="40" y="620" font-size="18" fill="#6b6a64">箭头表示直接内部依赖，省略第三方依赖；ai 还使用 telemetry。依据固定版本 package.json。</text></svg>