<svg style="font-family:Noto Sans CJK SC,system-ui,sans-serif" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 568" role="img" aria-labelledby="architecture-comparison-title architecture-comparison-desc"><title id="architecture-comparison-title">旧版与新版的分层对照</title><desc id="architecture-comparison-desc">旧版 Agent 经 transport 使用 ai 包中的循环；新版 AgentSession 管理会话，agent 包拥有循环，ai 专注模型接入。</desc><defs><marker id="architecture-comparison-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#1B365D"/></marker></defs><rect width="960" height="568" fill="#faf9f5"/><path d="M230 168 V240" fill="none" stroke="#1B365D" stroke-width="2"  marker-end="url(#architecture-comparison-arrow)"/><path d="M230 328 V400" fill="none" stroke="#1B365D" stroke-width="2"  marker-end="url(#architecture-comparison-arrow)"/><path d="M730 168 V240" fill="none" stroke="#1B365D" stroke-width="2"  marker-end="url(#architecture-comparison-arrow)"/><path d="M730 328 V400" fill="none" stroke="#1B365D" stroke-width="2"  marker-end="url(#architecture-comparison-arrow)"/><rect x="70" y="80" width="320" height="88" rx="6" fill="#faf9f5" stroke="#1B365D" stroke-width="1.5"/><text x="230.0" y="110" text-anchor="middle" font-size="20" fill="#20201d">编码应用</text><text x="230.0" y="153" text-anchor="middle" font-size="15" fill="#6b6a64">旧版 main / TUI</text><rect x="70" y="240" width="320" height="88" rx="6" fill="#faf9f5" stroke="#1B365D" stroke-width="1.5"/><text x="230.0" y="270" text-anchor="middle" font-size="20" fill="#20201d">Agent + Transport</text><text x="230.0" y="313" text-anchor="middle" font-size="15" fill="#6b6a64">状态与传输抽象</text><rect x="70" y="400" width="320" height="88" rx="6" fill="#faf9f5" stroke="#1B365D" stroke-width="1.5"/><text x="230.0" y="430" text-anchor="middle" font-size="20" fill="#20201d">ai：循环与模型接入</text><text x="230.0" y="473" text-anchor="middle" font-size="15" fill="#6b6a64">工具循环在 ai 包内</text><rect x="570" y="80" width="320" height="88" rx="6" fill="#faf9f5" stroke="#1B365D" stroke-width="1.5"/><text x="730.0" y="110" text-anchor="middle" font-size="20" fill="#20201d">AgentSession / 资源 / 扩展</text><text x="730.0" y="153" text-anchor="middle" font-size="15" fill="#6b6a64">树形会话与上下文投影</text><rect x="570" y="240" width="320" height="88" rx="6" fill="#faf9f5" stroke="#1B365D" stroke-width="1.5"/><text x="730.0" y="270" text-anchor="middle" font-size="20" fill="#20201d">agent：Agent 与工具循环</text><text x="730.0" y="313" text-anchor="middle" font-size="15" fill="#6b6a64">通用嵌套调用契约</text><rect x="570" y="400" width="320" height="88" rx="6" fill="#faf9f5" stroke="#1B365D" stroke-width="1.5"/><text x="730.0" y="430" text-anchor="middle" font-size="20" fill="#20201d">ai：多提供商模型接入</text><text x="730.0" y="473" text-anchor="middle" font-size="15" fill="#6b6a64">流式事件与公共消息类型</text><text x="70" y="40" font-size="18" fill="#6b6a64">v0.9.4</text><text x="570" y="40" font-size="18" fill="#6b6a64">v1.3.0 普通 CLI</text><text x="70" y="540" font-size="18" fill="#6b6a64">Code Mode 接在新版工具侧；Durable 不在这条普通 CLI 运行链中。</text></svg>