<svg style="font-family:Noto Sans CJK SC,system-ui,sans-serif" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" role="img" aria-labelledby="discovery-title discovery-desc"><title id="discovery-title">工具发现的三条路径</title><desc id="discovery-desc">注册表中的工具可直接声明、经脚本发现调用，或由 tool_search 声明后直接调用；hidden 工具不可达。</desc><defs><marker id="discovery-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#1B365D"/></marker></defs><rect width="960" height="500" fill="#faf9f5"/><path d="M420 118 V140 Q420 148 412 148 H168 Q160 148 160 156 V190" fill="none" stroke="#1B365D" stroke-width="2"  marker-end="url(#discovery-arrow)"/><path d="M480 118 V190" fill="none" stroke="#1B365D" stroke-width="2"  marker-end="url(#discovery-arrow)"/><path d="M540 118 V140 Q540 148 548 148 H792 Q800 148 800 156 V190" fill="none" stroke="#1B365D" stroke-width="2"  marker-end="url(#discovery-arrow)"/><path d="M160 278 V350" fill="none" stroke="#1B365D" stroke-width="2"  marker-end="url(#discovery-arrow)"/><path d="M480 278 V350" fill="none" stroke="#1B365D" stroke-width="2"  marker-end="url(#discovery-arrow)"/><path d="M800 278 V350" fill="none" stroke="#1B365D" stroke-width="2"  marker-end="url(#discovery-arrow)"/><rect x="360" y="30" width="240" height="88" rx="6" fill="#faf9f5" stroke="#1B365D" stroke-width="1.5"/><text x="480.0" y="60" text-anchor="middle" font-size="20" fill="#20201d">工具注册与 exposure</text><text x="480.0" y="103" text-anchor="middle" font-size="15" fill="#6b6a64">不是全部塞入提示</text><rect x="40" y="190" width="240" height="88" rx="6" fill="#faf9f5" stroke="#1B365D" stroke-width="1.5"/><text x="160.0" y="220" text-anchor="middle" font-size="20" fill="#20201d">direct</text><text x="160.0" y="263" text-anchor="middle" font-size="15" fill="#6b6a64">模型直接可见</text><rect x="360" y="190" width="240" height="88" rx="6" fill="#faf9f5" stroke="#1B365D" stroke-width="1.5"/><text x="480.0" y="220" text-anchor="middle" font-size="20" fill="#20201d">codemode</text><text x="480.0" y="263" text-anchor="middle" font-size="15" fill="#6b6a64">脚本发现后调用</text><rect x="680" y="190" width="240" height="88" rx="6" fill="#faf9f5" stroke="#1B365D" stroke-width="1.5"/><text x="800.0" y="220" text-anchor="middle" font-size="20" fill="#20201d">deferred</text><text x="800.0" y="263" text-anchor="middle" font-size="15" fill="#6b6a64">按需加载声明</text><rect x="40" y="350" width="240" height="88" rx="6" fill="#faf9f5" stroke="#1B365D" stroke-width="1.5"/><text x="160.0" y="380" text-anchor="middle" font-size="20" fill="#20201d">普通工具调用</text><rect x="360" y="350" width="240" height="88" rx="6" fill="#faf9f5" stroke="#1B365D" stroke-width="1.5"/><text x="480.0" y="380" text-anchor="middle" font-size="20" fill="#20201d">searchTools / describe</text><text x="480.0" y="423" text-anchor="middle" font-size="15" fill="#6b6a64">结果先返回脚本</text><rect x="680" y="350" width="240" height="88" rx="6" fill="#faf9f5" stroke="#1B365D" stroke-width="1.5"/><text x="800.0" y="380" text-anchor="middle" font-size="20" fill="#20201d">tool_search</text><text x="800.0" y="423" text-anchor="middle" font-size="15" fill="#6b6a64">下一请求可直接调用</text><text x="40" y="478" font-size="18" fill="#6b6a64">MCP 的 codemode 与 deferred 都可被脚本调用；hidden 在两条间接路径中也不可达。</text></svg>