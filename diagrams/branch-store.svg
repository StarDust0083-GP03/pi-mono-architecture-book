<svg style="font-family:Noto Sans CJK SC,system-ui,sans-serif" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 468" role="img" aria-labelledby="branch-store-title branch-store-desc"><title id="branch-store-title">状态沿分支重放，外部文件不会回滚</title><desc id="branch-store-desc">从早期节点分叉时不继承另一路上的 store 写入，但文件系统副作用独立于会话分支。</desc><defs><marker id="branch-store-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#1B365D"/></marker></defs><rect width="960" height="468" fill="#faf9f5"/><path d="M280 208 H312 Q320 208 320 200 V116 Q320 108 328 108 H360" fill="none" stroke="#1B365D" stroke-width="2"  marker-end="url(#branch-store-arrow)"/><path d="M280 240 H300 Q308 240 308 248 V324 Q308 332 316 332 H360" fill="none" stroke="#1B365D" stroke-width="2"  marker-end="url(#branch-store-arrow)"/><path d="M600 108 H680" fill="none" stroke="#1B365D" stroke-width="2"  marker-end="url(#branch-store-arrow)"/><path d="M600 332 H680" fill="none" stroke="#1B365D" stroke-width="2"  marker-end="url(#branch-store-arrow)"/><rect x="40" y="176" width="240" height="88" rx="6" fill="#faf9f5" stroke="#1B365D" stroke-width="1.5"/><text x="160.0" y="206" text-anchor="middle" font-size="20" fill="#20201d">共同历史</text><text x="160.0" y="249" text-anchor="middle" font-size="15" fill="#6b6a64">store: inspected = 1</text><rect x="360" y="64" width="240" height="88" rx="6" fill="#faf9f5" stroke="#1B365D" stroke-width="1.5"/><text x="480.0" y="94" text-anchor="middle" font-size="20" fill="#20201d">分支 A 成功</text><text x="480.0" y="137" text-anchor="middle" font-size="15" fill="#6b6a64">store: inspected = 2</text><rect x="680" y="64" width="240" height="88" rx="6" fill="#faf9f5" stroke="#1B365D" stroke-width="1.5"/><text x="800.0" y="94" text-anchor="middle" font-size="20" fill="#20201d">继续 A</text><text x="800.0" y="137" text-anchor="middle" font-size="15" fill="#6b6a64">load 得到 2</text><rect x="360" y="288" width="240" height="88" rx="6" fill="#faf9f5" stroke="#1B365D" stroke-width="1.5"/><text x="480.0" y="318" text-anchor="middle" font-size="20" fill="#20201d">分支 B</text><text x="480.0" y="361" text-anchor="middle" font-size="15" fill="#6b6a64">从共同历史分出</text><rect x="680" y="288" width="240" height="88" rx="6" fill="#faf9f5" stroke="#1B365D" stroke-width="1.5"/><text x="800.0" y="318" text-anchor="middle" font-size="20" fill="#20201d">继续 B</text><text x="800.0" y="361" text-anchor="middle" font-size="15" fill="#6b6a64">load 得到 1</text><text x="40" y="432" font-size="18" fill="#6b6a64">若 A 已写入外部文件，切回 B 不会把文件恢复到过去。失败脚本不提交 store，但副作用也不撤销。</text></svg>