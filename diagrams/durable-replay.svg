<svg style="font-family:Noto Sans CJK SC,system-ui,sans-serif" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" role="img" aria-labelledby="durable-replay-title durable-replay-desc"><title id="durable-replay-title">确定性重放，不是 VM 内存快照</title><desc id="durable-replay-desc">首次运行先记录工具结果再交给脚本；重启后用相同代码环境和结果顺序重放，再继续新的调用。</desc><defs><marker id="durable-replay-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#1B365D"/></marker></defs><rect width="960" height="480" fill="#faf9f5"/><path d="M290 116 H350" fill="none" stroke="#1B365D" stroke-width="2"  marker-end="url(#durable-replay-arrow)"/><path d="M610 116 H670" fill="none" stroke="#1B365D" stroke-width="2"  marker-end="url(#durable-replay-arrow)"/><path d="M290 344 H350" fill="none" stroke="#1B365D" stroke-width="2"  marker-end="url(#durable-replay-arrow)"/><path d="M610 344 H670" fill="none" stroke="#1B365D" stroke-width="2"  marker-end="url(#durable-replay-arrow)"/><path d="M800 160 V264 Q800 272 792 272 H488 Q480 272 480 280 V300" fill="none" stroke="#1B365D" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#durable-replay-arrow)"/><rect x="30" y="72" width="260" height="88" rx="6" fill="#faf9f5" stroke="#1B365D" stroke-width="1.5"/><text x="160.0" y="102" text-anchor="middle" font-size="20" fill="#20201d">相同代码与环境</text><text x="160.0" y="145" text-anchor="middle" font-size="15" fill="#6b6a64">seed、虚拟时间、指纹</text><rect x="350" y="72" width="260" height="88" rx="6" fill="#faf9f5" stroke="#1B365D" stroke-width="1.5"/><text x="480.0" y="102" text-anchor="middle" font-size="20" fill="#20201d">首次运行</text><text x="480.0" y="145" text-anchor="middle" font-size="15" fill="#6b6a64">发出嵌套任务</text><rect x="670" y="72" width="260" height="88" rx="6" fill="#faf9f5" stroke="#1B365D" stroke-width="1.5"/><text x="800.0" y="102" text-anchor="middle" font-size="20" fill="#20201d">先记录再交付</text><text x="800.0" y="145" text-anchor="middle" font-size="15" fill="#6b6a64">结果写入 journal</text><rect x="30" y="300" width="260" height="88" rx="6" fill="#faf9f5" stroke="#1B365D" stroke-width="1.5"/><text x="160.0" y="330" text-anchor="middle" font-size="20" fill="#20201d">进程重启</text><text x="160.0" y="373" text-anchor="middle" font-size="15" fill="#6b6a64">恢复 Harness 与任务</text><rect x="350" y="300" width="260" height="88" rx="6" fill="#faf9f5" stroke="#1B365D" stroke-width="1.5"/><text x="480.0" y="330" text-anchor="middle" font-size="20" fill="#20201d">重新运行脚本</text><text x="480.0" y="373" text-anchor="middle" font-size="15" fill="#6b6a64">按序喂回已记录结果</text><rect x="670" y="300" width="260" height="88" rx="6" fill="#faf9f5" stroke="#1B365D" stroke-width="1.5"/><text x="800.0" y="330" text-anchor="middle" font-size="20" fill="#20201d">关联已有调用并继续</text><text x="800.0" y="373" text-anchor="middle" font-size="15" fill="#6b6a64">未完成工具服从 replay 策略</text><text x="30" y="440" font-size="18" fill="#6b6a64">外部副作用仍要幂等；普通 CLI 的一次脚本执行没有自动获得这些恢复保证。</text></svg>