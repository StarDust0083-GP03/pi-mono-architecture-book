<svg style="font-family:Noto Sans CJK SC,system-ui,sans-serif" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" role="img" aria-labelledby="deployment-title deployment-desc"><title id="deployment-title">相同脚本 API，不同计算位置</title><desc id="deployment-desc">Node/Bun 用 worker thread，Cloudflare 可把 VM 放在单独 Worker 的 Durable Object，inline 模式在调用线程运行。</desc><defs><marker id="deployment-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#1B365D"/></marker></defs><rect width="960" height="520" fill="#faf9f5"/><path d="M340 108 H600" fill="none" stroke="#1B365D" stroke-width="2"  marker-end="url(#deployment-arrow)"/><path d="M340 268 H600" fill="none" stroke="#1B365D" stroke-width="2"  marker-end="url(#deployment-arrow)"/><path d="M340 428 H600" fill="none" stroke="#1B365D" stroke-width="2"  marker-end="url(#deployment-arrow)"/><rect x="40" y="64" width="300" height="88" rx="6" fill="#faf9f5" stroke="#1B365D" stroke-width="1.5"/><text x="190.0" y="94" text-anchor="middle" font-size="20" fill="#20201d">Node / Bun 宿主</text><text x="190.0" y="137" text-anchor="middle" font-size="15" fill="#6b6a64">工具与 deadline</text><rect x="600" y="64" width="300" height="88" rx="6" fill="#faf9f5" stroke="#1B365D" stroke-width="1.5"/><text x="750.0" y="94" text-anchor="middle" font-size="20" fill="#20201d">worker thread</text><text x="750.0" y="137" text-anchor="middle" font-size="15" fill="#6b6a64">QuickJS VM</text><rect x="40" y="224" width="300" height="88" rx="6" fill="#faf9f5" stroke="#1B365D" stroke-width="1.5"/><text x="190.0" y="254" text-anchor="middle" font-size="20" fill="#20201d">Cloudflare 会话侧</text><text x="190.0" y="297" text-anchor="middle" font-size="15" fill="#6b6a64">工具与调用记录</text><rect x="600" y="224" width="300" height="88" rx="6" fill="#faf9f5" stroke="#1B365D" stroke-width="1.5"/><text x="750.0" y="254" text-anchor="middle" font-size="20" fill="#20201d">单独部署的 Worker</text><text x="750.0" y="297" text-anchor="middle" font-size="15" fill="#6b6a64">Durable Object 中的 VM</text><rect x="40" y="384" width="300" height="88" rx="6" fill="#faf9f5" stroke="#1B365D" stroke-width="1.5"/><text x="190.0" y="414" text-anchor="middle" font-size="20" fill="#20201d">Inline 宿主</text><text x="190.0" y="457" text-anchor="middle" font-size="15" fill="#6b6a64">允许计算阻塞调用线程</text><rect x="600" y="384" width="300" height="88" rx="6" fill="#faf9f5" stroke="#1B365D" stroke-width="1.5"/><text x="750.0" y="414" text-anchor="middle" font-size="20" fill="#20201d">同一线程的 VM</text><text x="750.0" y="457" text-anchor="middle" font-size="15" fill="#6b6a64">interrupt budget</text><text x="380" y="88" font-size="18" fill="#6b6a64">线程消息</text><text x="380" y="248" font-size="18" fill="#6b6a64">Workers RPC</text><text x="380" y="408" font-size="18" fill="#6b6a64">直接调用</text></svg>