<svg style="font-family:Noto Sans CJK SC,system-ui,sans-serif" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 508" role="img" aria-labelledby="durable-package-dependencies-title durable-package-dependencies-desc"><title id="durable-package-dependencies-title">Durable 与远程执行的包关系</title><desc id="durable-package-dependencies-desc">env 依赖 Durable 与 chord；Durable 依赖 ai、codemode、chord。这套独立运行时与普通 CLI 分开。</desc><defs><marker id="durable-package-dependencies-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#1B365D"/></marker></defs><rect width="960" height="508" fill="#faf9f5"/><path d="M480 116 V180" fill="none" stroke="#1B365D" stroke-width="2"  marker-end="url(#durable-package-dependencies-arrow)"/><path d="M600 72 H928 Q936 72 936 80 V376 Q936 384 928 384 H920" fill="none" stroke="#1B365D" stroke-width="2"  marker-end="url(#durable-package-dependencies-arrow)"/><path d="M420 268 V284 Q420 292 412 292 H168 Q160 292 160 300 V340" fill="none" stroke="#1B365D" stroke-width="2"  marker-end="url(#durable-package-dependencies-arrow)"/><path d="M480 268 V340" fill="none" stroke="#1B365D" stroke-width="2"  marker-end="url(#durable-package-dependencies-arrow)"/><path d="M540 268 V284 Q540 292 548 292 H792 Q800 292 800 300 V340" fill="none" stroke="#1B365D" stroke-width="2"  marker-end="url(#durable-package-dependencies-arrow)"/><rect x="360" y="28" width="240" height="88" rx="6" fill="#faf9f5" stroke="#1B365D" stroke-width="1.5"/><text x="480.0" y="58" text-anchor="middle" font-size="20" fill="#20201d">env</text><text x="480.0" y="101" text-anchor="middle" font-size="15" fill="#6b6a64">远程 ExecutionEnv / Rust daemon</text><rect x="360" y="180" width="240" height="88" rx="6" fill="#faf9f5" stroke="#1B365D" stroke-width="1.5"/><text x="480.0" y="210" text-anchor="middle" font-size="20" fill="#20201d">durable</text><text x="480.0" y="253" text-anchor="middle" font-size="15" fill="#6b6a64">实验性持久任务 Harness</text><rect x="40" y="340" width="240" height="88" rx="6" fill="#faf9f5" stroke="#1B365D" stroke-width="1.5"/><text x="160.0" y="370" text-anchor="middle" font-size="20" fill="#20201d">ai</text><text x="160.0" y="413" text-anchor="middle" font-size="15" fill="#6b6a64">模型调用</text><rect x="360" y="340" width="240" height="88" rx="6" fill="#faf9f5" stroke="#1B365D" stroke-width="1.5"/><text x="480.0" y="370" text-anchor="middle" font-size="20" fill="#20201d">codemode</text><text x="480.0" y="413" text-anchor="middle" font-size="15" fill="#6b6a64">QuickJS 与确定性执行</text><rect x="680" y="340" width="240" height="88" rx="6" fill="#faf9f5" stroke="#1B365D" stroke-width="1.5"/><text x="800.0" y="370" text-anchor="middle" font-size="20" fill="#20201d">chord</text><text x="800.0" y="413" text-anchor="middle" font-size="15" fill="#6b6a64">文档状态与 Context</text><text x="40" y="478" font-size="18" fill="#6b6a64">箭头表示直接内部依赖。普通 coding-agent 不依赖这套 Harness，也不会自动获得持久重放。</text></svg>